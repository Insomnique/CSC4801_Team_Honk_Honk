services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: honk
      POSTGRES_USER: honk
      POSTGRES_PASSWORD: honk_local_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_NAME: honk
      DB_USER: honk
      DB_PASSWORD: honk_local_dev
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "1"
    depends_on:
      - db

volumes:
  pgdata: