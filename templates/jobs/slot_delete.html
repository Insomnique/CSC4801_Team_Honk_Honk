{% extends "base.html" %}
{% block title %}Delete slot{% endblock %}
{% block content %}
<h1>Delete slot "{{ slot.start_time|date:"Y-m-d H:i" }} UTC"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'jobs:slot_list' %}">Cancel</a>
</form>
{% endblock %}
